name: zerack_fit
description: "ZERACK Fit: entrenamiento adaptado a tu salud. Local-first."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  camera: ^0.12.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  health: ^13.3.2
  http: ^1.6.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.3.0
  zerack_core:
    path: ../../packages/zerack_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/foods_es.json
    - assets/legal/
